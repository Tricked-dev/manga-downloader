[workspace]
resolver = "3"
members = ["crates/*", "apps/rust/*", "plugins/comix", "plugins/crates/manga-plugin-kit"]
exclude = ["inspo", "apps/clients/aidoku"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
allocative = { version = "0.3.6" }
anyhow = { version = "1.0.102" }
apalis = { version = "1.0.0-rc.9", default-features = false, features = ["tracing"] }
async-tungstenite = { version = "0.34.1", default-features = false, features = ["tokio-rustls-webpki-roots"] }
async-tungstenite-chromiumoxide = { package = "async-tungstenite", version = "0.32.1", default-features = false, features = ["tokio-rustls-webpki-roots"] }
autometrics = { version = "3.0.0", default-features = false, features = ["metrics"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "matched-path", "multipart", "query", "tokio", "tracing"] }
axum-client-ip = { version = "1.3.1" }
axum-otel-metrics = { version = "0.13.0" }
axum-test = { version = "20.1.0", default-features = false }
backon = { version = "1.6.0", default-features = false, features = ["std"] }
base64 = { version = "0.22.1" }
byte-unit = { version = "5.2.0", default-features = false, features = ["byte", "serde", "std"] }
bytecheck = { version = "0.8.2" }
bytes = { version = "1.11.1" }
cargo-deny = { version = "=0.19.9" }
cargo-shear = { version = "=1.13.1", default-features = false }
chromiumoxide = { version = "0.9.1" }
clap = { version = "4.6.1", features = ["derive", "env"] }
criterion = { version = "0.8.2" }
dashmap = { version = "6.2.1" }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
flamegraph = { version = "0.6.13" }
foyer = { version = "0.22.3", features = ["serde"] }
fs4 = { version = "1.1.0" }
fusio = { version = "0.6.1", default-features = false, features = ["fs", "tokio"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
garde = { version = "0.23.0", features = ["derive", "url"] }
gix = { version = "0.84.0", default-features = true, features = ["blocking-network-client", "worktree-mutation"] }
http = { version = "1.4.2" }
image = { version = "0.25.10", default-features = false, features = ["avif", "gif", "jpeg", "png", "webp"] }
jiff = { version = "0.2.28", features = ["serde"] }
metrics = { version = "0.24.6" }
metrics-exporter-otel = { version = "0.3.1" }
mime_guess = { version = "2.0.5" }
mixtrics = { version = "=0.2.4" }
natord = { version = "1.0.9" }
opentelemetry = { version = "0.31.0" }
opentelemetry-appender-tracing = { version = "0.31.1" }
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.31.0" }
postcard = { version = "1.1.3", features = ["alloc"] }
proptest = { version = "1.11.0" }
quick-xml = { version = "0.40.1", features = ["serialize"] }
rayon = { version = "1.12.0" }
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "rustls-no-provider", "zstd"] }
rkyv = { version = "0.8.16", features = ["bytecheck"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
rustls-graviola = { version = "0.3.4", default-features = false }
sanitize-filename = { version = "0.6.0" }
schematic = { version = "0.19.7" }
secrecy = { version = "0.10.3", default-features = false }
semver = { version = "1.0.28", default-features = false }
serde = { version = "1.0.228", features = ["alloc", "derive"] }
serde_json = { version = "1.0.150", features = ["alloc"] }
shadow-rs = { version = "2.0.0", default-features = false }
sha2 = { version = "0.11.0" }
starlark = { version = "0.14.2" }
superconsole = { version = "0.2.0" }
tar = { version = "0.4.46", default-features = false }
tempfile = { version = "3.27.0" }
thiserror = { version = "2.0.18" }
toasty = { version = "0.7.0", features = ["serde"] }
toasty-core = { version = "0.7.0" }
toasty-driver-sqlite = { version = "0.7.0" }
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-graceful = { version = "0.2.2" }
tokio-metrics = { version = "0.5.0", features = ["metrics-rs-integration"] }
tower = { version = "0.5.3", default-features = false, features = ["limit", "util"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.7.0", default-features = false, features = ["auth", "cors", "fs", "request-id", "sensitive-headers", "trace"] }
tower-resilience-coalesce = { version = "0.10.0" }
tower-resilience-ratelimiter = { version = "0.10.0", features = ["metrics"] }
tower-resilience-retry = { version = "0.10.0", features = ["metrics"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-opentelemetry = { version = "0.32.1" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry"] }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-native-roots", "zstd"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-native-roots"] }
twilight-interactions = { version = "0.17.1" }
twilight-model = { version = "0.17.1" }
url = { version = "2.5.8" }
utoipa = { version = "5.5.0" }
utoipa-axum = { version = "0.2.0" }
uuid = { version = "1.23.3", default-features = false, features = ["serde", "v4", "v7"] }
wasmtime = { version = "45.0.2", default-features = false, features = ["anyhow", "async", "cache", "component-model", "cranelift", "parallel-compilation", "runtime", "std"] }
wasmtime-wasi = { version = "45.0.2", default-features = false, features = ["p2"] }
wit-bindgen = { version = "0.58.0" }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
zstd = { version = "0.13.3", default-features = false, features = ["zstdmt"] }
mimalloc = "0.1.48"
