name = "manga-server-frontend"
main = ".svelte-kit/cloudflare/_worker.js"
account_id = "546a3e5cf621650359c51a1df792b2cf"
compatibility_date = "2026-04-03"
compatibility_flags = ["nodejs_als", "nodejs_compat"]

[placement]
mode = "smart"

[vars]
AUTH_ENABLED = "true"
BACKEND_URL = "https://manga-api.trashcan.ing"
BACKEND_INTERNAL_URL = "http://100.96.0.8"
BETTER_AUTH_URL = "https://manga.trashcan.ing"
OIDC_CLIENT_ID = "manga-server"
OIDC_ISSUER_URL = "https://auth.trashcan.ing/oauth2/openid/manga-server"
OIDC_PRIVATE_BASE_URL = "http://100.96.0.8"
OIDC_PROVIDER_ID = "oidc"
OIDC_SCOPES = "openid profile email"

[[routes]]
pattern = "manga.trashcan.ing"
custom_domain = true

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "AUTH_DB"
database_name = "manga-server-auth"
database_id = "a68202d8-58d4-4ca1-a1d8-52f3c2c6cd55"

[[vpc_networks]]
binding = "TRASHCAN_MESH"
network_id = "cf1:network"
remote = true
