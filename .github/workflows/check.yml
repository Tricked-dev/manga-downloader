name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Hermetic build, SQLite tests, lint and formatting
        run: nix flake check --print-build-logs
      - name: Install development runner
        run: nix profile install --inputs-from . nixpkgs#devenv
      - name: PostgreSQL integration tests
        run: |
          devenv --profile postgres up --detach
          trap 'devenv --profile postgres processes down' EXIT
          devenv --profile postgres shell test-postgres
