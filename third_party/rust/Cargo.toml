[package]
name = "manga-rust-third-party"
version = "0.1.0"
edition = "2024"
publish = false
build = "do_not_build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
allocative = { version = "0.3.6", optional = true }
anyhow = { version = "1.0.102", optional = true }
apalis = { version = "1.0.0-rc.9", default-features = false, features = ["tracing"], optional = true }
async-tungstenite = { version = "0.34.1", default-features = false, features = ["tokio-rustls-webpki-roots"], optional = true }
async-tungstenite-chromiumoxide = { package = "async-tungstenite", version = "0.32.1", default-features = false, features = ["tokio-rustls-webpki-roots"], optional = true }
autometrics = { version = "3.0.0", default-features = false, features = ["metrics"], optional = true }
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "matched-path", "multipart", "query", "tokio", "tracing"], optional = true }
axum-client-ip = { version = "1.3.1", optional = true }
axum-otel-metrics = { version = "0.13.0", optional = true }
axum-test = { version = "20.1.0", default-features = false, optional = true }
backon = { version = "1.6.0", default-features = false, features = ["std"], optional = true }
base64 = { version = "0.22.1", optional = true }
byte-unit = { version = "5.2.0", default-features = false, features = ["byte", "serde", "std"], optional = true }
bytecheck = { version = "0.8.2", optional = true }
bytes = { version = "1.11.1", optional = true }
cargo-deny = { version = "=0.19.9", optional = true }
cargo-shear = { version = "=1.13.1", default-features = false, optional = true }
chromiumoxide = { version = "0.9.1", optional = true }
clap = { version = "4.6.1", features = ["derive", "env"], optional = true }
criterion = { version = "0.8.2", optional = true }
dashmap = { version = "6.2.1", optional = true }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"], optional = true }
flamegraph = { version = "0.6.13", optional = true }
foyer = { version = "0.22.3", features = ["serde"], optional = true }
fs4 = { version = "1.1.0", optional = true }
fusio = { version = "0.6.1", default-features = false, features = ["fs", "tokio"], optional = true }
futures-util = { version = "0.3.32", default-features = false, features = ["std"], optional = true }
garde = { version = "0.23.0", features = ["derive", "url"], optional = true }
gix = { version = "0.84.0", default-features = true, features = ["blocking-network-client", "worktree-mutation"], optional = true }
http = { version = "1.4.2", optional = true }
image = { version = "0.25.10", default-features = false, features = ["avif", "gif", "jpeg", "png", "webp"], optional = true }
jiff = { version = "0.2.28", features = ["serde"], optional = true }
metrics = { version = "0.24.6", optional = true }
metrics-exporter-otel = { version = "0.3.1", optional = true }
mime_guess = { version = "2.0.5", optional = true }
mixtrics = { version = "=0.2.4", optional = true }
natord = { version = "1.0.9", optional = true }
opentelemetry = { version = "0.31.0", optional = true }
opentelemetry-appender-tracing = { version = "0.31.1", optional = true }
opentelemetry-otlp = { version = "0.31.1", features = ["grpc-tonic"], optional = true }
opentelemetry_sdk = { version = "0.31.0", optional = true }
postcard = { version = "1.1.3", features = ["alloc"], optional = true }
proptest = { version = "1.11.0", optional = true }
quick-xml = { version = "0.40.1", features = ["serialize"], optional = true }
rayon = { version = "1.12.0", optional = true }
reqwest = { version = "0.13.4", default-features = false, features = ["cookies", "json", "rustls-no-provider", "zstd"], optional = true }
rkyv = { version = "0.8.16", features = ["bytecheck"], optional = true }
rusqlite = { version = "0.39.0", optional = true }
rustls-graviola = { version = "0.3.4", default-features = false, optional = true }
sanitize-filename = { version = "0.6.0", optional = true }
schematic = { version = "0.19.7", optional = true }
secrecy = { version = "0.10.3", default-features = false, optional = true }
semver = { version = "1.0.28", default-features = false, optional = true }
serde = { version = "1.0.228", features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0.150", features = ["alloc"], optional = true }
shadow-rs = { version = "2.0.0", default-features = false, optional = true }
sha2 = { version = "0.11.0", optional = true }
starlark = { version = "0.14.2", optional = true }
superconsole = { version = "0.2.0", optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
tempfile = { version = "3.27.0", optional = true }
thiserror = { version = "2.0.18", optional = true }
toasty = { version = "0.7.0", features = ["serde"], optional = true }
toasty-core = { version = "0.7.0", optional = true }
toasty-driver-sqlite = { version = "0.7.0", optional = true }
tokio = { version = "1.52.3", default-features = false, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"], optional = true }
tokio-graceful = { version = "0.2.2", optional = true }
tokio-metrics = { version = "0.5.0", features = ["metrics-rs-integration"], optional = true }
tower = { version = "0.5.3", default-features = false, features = ["limit", "util"], optional = true }
tokio-util = { version = "0.7.18", features = ["io"], optional = true }
tower-http = { version = "0.7.0", default-features = false, features = ["auth", "cors", "fs", "request-id", "sensitive-headers", "trace"], optional = true }
tower-resilience-coalesce = { version = "0.10.0", optional = true }
tower-resilience-ratelimiter = { version = "0.10.0", features = ["metrics"], optional = true }
tower-resilience-retry = { version = "0.10.0", features = ["metrics"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
tracing-opentelemetry = { version = "0.32.1", optional = true }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "registry"], optional = true }
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-native-roots", "zstd"], optional = true }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-native-roots"], optional = true }
twilight-interactions = { version = "0.17.1", optional = true }
twilight-model = { version = "0.17.1", optional = true }
url = { version = "2.5.8", optional = true }
utoipa = { version = "5.5.0", optional = true }
utoipa-axum = { version = "0.2.0", optional = true }
uuid = { version = "1.23.3", default-features = false, features = ["serde", "v4", "v7"], optional = true }
wasmtime = { version = "45.0.2", default-features = false, features = ["anyhow", "async", "cache", "component-model", "cranelift", "parallel-compilation", "runtime", "std"], optional = true }
wasmtime-wasi = { version = "45.0.2", default-features = false, features = ["p2"], optional = true }
wit-bindgen = { version = "0.58.0", optional = true }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
zstd = { version = "0.13.3", default-features = false, features = ["zstdmt"], optional = true }
